plugins {
    id 'java'
    id 'application'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.splunk.otel'
version = '0.1.0'

java {
    // Pin the JDK Gradle compiles with, rather than inheriting whatever the developer's default is.
    // Without this, a machine whose default JDK is newer than Gradle 8.8 supports fails with
    // "Unsupported class file major version", which reads like a code problem rather than a
    // toolchain mismatch. 17 is what CI uses.
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
    // Bytecode stays at 11: the receiver is documented as running on Java 11+.
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'com.splunk.otel.db2.Main'
}

repositories {
    mavenCentral()
}

def otelVersion = '1.62.0'

dependencies {
    // OTel SDK
    implementation "io.opentelemetry:opentelemetry-sdk:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk-metrics:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk-logs:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:${otelVersion}"

    // Config parsing
    implementation 'org.yaml:snakeyaml:2.2'

    // IBM DB2 JDBC Type 4
    implementation 'com.ibm.db2:jcc:11.5.9.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.34'
    implementation 'org.slf4j:jul-to-slf4j:2.0.13'

    // Test
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:${otelVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.assertj:assertj-core:3.26.0'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:db2:1.20.1'
    testImplementation 'org.awaitility:awaitility:4.2.1'
}

test {
    useJUnitPlatform()
    excludes = ['**/*IntegrationTest*']
}

task integrationTest(type: Test) {
    useJUnitPlatform {
        excludeTags 'snapshot'
    }
    includes = ['**/*IntegrationTest*']
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }
}

// Snapshot monitor path — requires DFT_MON_STMT ON on the DB2 instance.
// Run via a separate CI job: ./gradlew integrationTestSnapshot
task integrationTestSnapshot(type: Test) {
    useJUnitPlatform {
        includeTags 'snapshot'
    }
    includes = ['**/*IntegrationTest*']
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    // Without this a passing run prints nothing, so there is no way to tell from CI output which
    // snapshot tests actually ran.
    testLogging {
        events 'passed', 'failed', 'skipped'
        showStandardStreams = true
        exceptionFormat = org.gradle.api.tasks.testing.logging.TestExceptionFormat.FULL
    }
}

shadowJar {
    mergeServiceFiles()
    manifest { attributes 'Main-Class': 'com.splunk.otel.db2.Main' }
    archiveClassifier.set('')
}

// Make 'jar' task an alias for shadowJar
jar.dependsOn shadowJar
jar.enabled = false
