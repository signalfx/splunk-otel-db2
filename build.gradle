plugins {
    id 'java'
    id 'application'
}

def generatedSrcDir = "$buildDir/generated/sources/metrics/main/java"

sourceSets {
    main {
        java { srcDir generatedSrcDir }
    }
}

group = 'com.splunk.otel'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

application {
    mainClass = 'com.splunk.otel.db2.Main'
}

repositories {
    mavenCentral()
}

def otelVersion = '1.38.0'

dependencies {
    // OTel SDK
    implementation "io.opentelemetry:opentelemetry-sdk:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk-metrics:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-exporter-otlp:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk-logs:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure:${otelVersion}"
    implementation "io.opentelemetry:opentelemetry-sdk-extension-autoconfigure-spi:${otelVersion}"

    // Config parsing
    implementation 'org.yaml:snakeyaml:2.2'

    // IBM DB2 JDBC Type 4
    implementation 'com.ibm.db2:jcc:11.5.9.0'

    // Logging
    implementation 'org.slf4j:slf4j-api:2.0.13'
    implementation 'ch.qos.logback:logback-classic:1.5.6'

    // Test
    testImplementation "io.opentelemetry:opentelemetry-sdk-testing:${otelVersion}"
    testImplementation 'org.junit.jupiter:junit-jupiter:5.10.3'
    testImplementation 'org.assertj:assertj-core:3.26.0'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    testImplementation 'org.testcontainers:junit-jupiter:1.20.1'
    testImplementation 'org.testcontainers:db2:1.20.1'
    testImplementation 'org.awaitility:awaitility:4.2.1'
}

task generateMetrics(type: JavaExec) {
    description = 'Generate Db2Metrics.java from metadata.yaml'
    // MetricsGenerator lives in buildSrc — use its compiled output + buildSrc deps (snakeyaml)
    classpath = files(
        "$rootDir/buildSrc/build/classes/java/main",
        "$rootDir/buildSrc/build/resources/main"
    ) + fileTree("$rootDir/buildSrc/build/libs") + configurations.detachedConfiguration(
        dependencies.create('org.yaml:snakeyaml:2.2')
    )
    mainClass = 'com.splunk.otel.db2.codegen.MetricsGenerator'
    args = [
        "$rootDir/metadata.yaml",
        generatedSrcDir
    ]
    inputs.file "$rootDir/metadata.yaml"
    outputs.dir generatedSrcDir
}

compileJava.dependsOn generateMetrics

test {
    useJUnitPlatform()
    // skip integration tests by default (need real DB2)
    excludes = ['**/*IntegrationTest*']
}

task integrationTest(type: Test) {
    useJUnitPlatform()
    includes = ['**/*IntegrationTest*']
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
}

jar {
    manifest {
        attributes 'Main-Class': 'com.splunk.otel.db2.Main'
    }
    from {
        configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : zipTree(it)
        }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}
