receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 10s

exporters:
  # Splunk Observability Cloud — metrics via OTLP/HTTP (/v2/datapoint/otlp).
  # Logs are not accepted through this endpoint; see the logs pipeline below.
  otlphttp/splunk:
    metrics_endpoint: "https://ingest.${env:SPLUNK_REALM}.signalfx.com/v2/datapoint/otlp"
    headers:
      X-SF-Token: "${env:SPLUNK_TOKEN}"

  # Logs printed to stdout for local inspection only.
  # Splunk Observability Cloud does not accept logs via OTLP/HTTP.
  debug:
    verbosity: normal

service:
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlphttp/splunk]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
