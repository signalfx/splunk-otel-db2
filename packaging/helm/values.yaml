# Default values for splunk-otel-db2 Helm chart.

# Read by a parent chart's `condition: <alias>.enabled`, not by this chart's own templates.
#
# A parent gates this subchart on a key in its own values, and Helm resolves that condition
# against the coalesced values — which include this file. Declaring it here means the
# subchart stays disabled even when the parent's key is missing, which is what happens under
# `helm upgrade --reuse-values` from a release that predates the parent adding it. Without
# this, such an upgrade enables the subchart and then fails to render on the placeholder
# receiver.
#
# Installing this chart directly ignores it; a standalone install renders regardless.
enabled: false

image:
  repository: ghcr.io/signalfx/splunk-otel-db2
  pullPolicy: IfNotPresent
  # Overrides the image tag. Defaults to the chart appVersion.
  tag: ""

# imagePullSecrets is required when pulling from a private GHCR registry.
# Example:
#   imagePullSecrets:
#     - name: ghcr-credentials
imagePullSecrets: []

# Number of receiver replicas. Each replica opens its own JDBC connection(s).
# Use 1 unless you are sharding databases across multiple pods.
replicaCount: 1

serviceAccount:
  create: true
  annotations: {}
  name: ""

podAnnotations: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10001
  runAsGroup: 10001
  fsGroup: 10001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

# ── Receiver configuration ───────────────────────────────────────────────────
# Each entry under `receivers` maps to a db2/<name> pipeline.
# `name` must be lowercase DNS-compatible: lowercase letters, digits, and hyphens only,
# starting with a letter (e.g. "prod-eu", "default"). Uppercase letters and underscores
# are not allowed because each name is uppercased and turned into an env-var key
# (DB2_USER_<NAME>, DB2_PASSWORD_<NAME>); ambiguous names like "foo-bar" vs "foo_bar"
# would silently share the same variables. The chart rejects invalid or colliding names.
# `credentialsSecret` is the name of a pre-existing Kubernetes Secret with
# keys DB2_USER and DB2_PASSWORD. If omitted, the chart creates the Secret
# from `username` / `password` (not recommended for production).
# `name` must be lowercase DNS-compatible: lowercase letters, digits, and interior hyphens,
# starting with a letter (e.g. "prod-eu", "default"). Uppercase and underscores are rejected
# because each name is uppercased into env-var keys (DB2_USER_<NAME>, DB2_PASSWORD_<NAME>),
# so "foo-bar" and "foo_bar" would silently share credentials.
#
# Note that Helm replaces a list wholesale rather than merging its elements: if you supply
# your own `receivers` rather than editing the entry below, it inherits nothing from this
# one. `name`, `hostname`, `database` and credentials are always required, and `port` joins
# them whenever TLS is on; everything else defaults.
receivers:
  - name: default
    hostname: "localhost"
    # port is deliberately absent. TLS is on below, and Db2 requires ssl_svcename to listen
    # on a different port from svcename — so shipping 50000 here would hand you a default
    # that aims a TLS handshake at the cleartext listener. Set your ssl_svcename port, or
    # set tls.insecure: true and the cleartext default (50000) applies.
    database: "SAMPLE"
    collectionInterval: "30s"
    # Reference a pre-existing Secret containing DB2_USER and DB2_PASSWORD. This is the
    # recommended form, and the one thing you must set — the chart refuses to install
    # without credentials rather than deploying a receiver that cannot connect.
    credentialsSecret: ""
    # Used only when credentialsSecret is empty — creates a Secret from these values,
    # which then appear in the release manifest.
    username: ""
    password: ""
    tls:
      # Db2 credentials travel over this connection, so TLS is the default. The certificate
      # must be trusted: either by the JVM's default truststore, or by a certificate
      # authority you supply through caSecret below.
      insecure: false
      # Skip checking the certificate was issued for the hostname above. Set true when you
      # connect by IP or by an alias the certificate does not list: that keeps the
      # connection encrypted, unlike insecure, which drops TLS entirely.
      #
      # Named to match exporters.otlp.tls and the collector's own database receivers. Those
      # default it to true; here it is false, so the certificate is checked unless you
      # opt out.
      insecureSkipVerify: false
      # Name of an existing Secret holding a certificate authority to trust, for a Db2 with
      # an internal or self-signed certificate. Mounted read-only and passed to the driver,
      # so those installs no longer need insecure: true. Without it the driver falls back to
      # the JVM default truststore, which will not contain an internal CA.
      caSecret: ""
      # Key within caSecret holding the PEM certificate. Only this key is mounted, so the
      # rest of the Secret stays out of the container.
      caSecretKey: ca.crt
    events:
      dbServerTopQuery:
        enabled: false
      dbServerQuerySample:
        enabled: false
    topQueryCollection:
      # Minimum 60s; lower values are rejected at startup.
      collectionInterval: "60s"
      topQueryCount: 250
      maxQuerySampleCount: 1000
      maxExplainEachInterval: 0
      queryPlanCacheSize: 1000
      queryPlanCacheTtl: "1h"
      explainSchema: ""
    querySampleCollection:
      # 5s is a recommended floor, not a limit. Lower values are honoured and warned
      # about once at startup: sampling runs on a fixed delay so collections cannot
      # stack, but the monitor queries weigh more heavily at a faster cadence.
      collectionInterval: "10s"
      maxRowsPerQuery: 100

# ── OTLP exporter ────────────────────────────────────────────────────────────
otlp:
  # Leave empty to derive the endpoint from the parent release when this chart is installed
  # as a dependency of splunk-otel-collector. Required when installing standalone, where the
  # collector Service name cannot be known.
  endpoint: ""
  # Which collector Service to derive the endpoint from: "agent" or "gateway".
  # Ignored when `endpoint` is set, and overridden to "gateway" if the parent chart passes
  # `global.gateway.enabled: true`.
  #
  # "agent" targets <release>-splunk-otel-collector-agent, deployed by default upstream but
  # internalTrafficPolicy: Local — it only reaches an agent Pod on this Pod's own Node.
  # "gateway" targets <release>-splunk-otel-collector, cluster-wide routable but only
  # deployed when the parent sets gateway.enabled.
  #
  # Use "gateway" (or set `endpoint`) when the agent Service does not exist. The parent does
  # not render it when agent.service.enabled is false, nor on EKS Fargate, which cannot run
  # DaemonSets. This chart cannot detect either case, so exports would silently go nowhere.
  collectorTarget: "agent"
  # Namespace of the collector Services, used only when deriving the endpoint. Defaults to
  # this release's namespace. Set it when the parent uses `namespaceOverride`, which places
  # those Services elsewhere and is not visible to a subchart.
  collectorNamespace: ""
  headers: {}
  compression: ""
  tls:
    insecure: true

# Extra environment variables injected into the pod (e.g. for ${env:VAR} config references)
extraEnv: []
# - name: MY_VAR
#   value: "my-value"

nodeSelector: {}
tolerations: []
affinity: {}
