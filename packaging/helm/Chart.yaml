apiVersion: v2
name: splunk-otel-db2
description: Standalone OpenTelemetry receiver for IBM DB2, shipping metrics and query samples to an OTLP endpoint.
type: application
version: 0.1.0
appVersion: "0.1.0"
keywords:
  - db2
  - ibm
  - opentelemetry
  - splunk
  - observability
home: https://github.com/signalfx/splunk-otel-db2
sources:
  - https://github.com/signalfx/splunk-otel-db2
maintainers:
  - name: signalfx/splunk-otel-db2-maintainers
    url: https://github.com/signalfx/splunk-otel-db2

dependencies:
  # Optional: bundle an OTel Collector alongside the scraper.
  # Enable with: --set opentelemetry-collector.enabled=true
  - name: opentelemetry-collector
    version: "0.113.*"
    repository: https://open-telemetry.github.io/opentelemetry-helm-charts
    condition: opentelemetry-collector.enabled
