{{- range .Values.receivers }}
{{- if not .credentialsSecret }}
{{- if not .username }}
{{- fail (printf "receivers[%s]: either credentialsSecret or username must be set" .name) }}
{{- end }}
{{- if not .password }}
{{- fail (printf "receivers[%s]: password must be set when managing credentials (credentialsSecret not provided)" .name) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "splunk-otel-db2.credentialsSecretName" (dict "receiver" . "releaseName" $.Release.Name) }}
  labels:
    {{- include "splunk-otel-db2.labels" $ | nindent 4 }}
type: Opaque
stringData:
  DB2_USER: {{ .username | quote }}
  DB2_PASSWORD: {{ .password | quote }}
{{- end }}
{{- end }}
