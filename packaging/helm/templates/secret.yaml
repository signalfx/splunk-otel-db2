{{- include "splunk-otel-db2.validateReceivers" . }}
{{- $prefix := .Chart.IsRoot | ternary "receivers" "db2.receivers" }}
{{- range $i, $r := .Values.receivers }}
{{- with $r }}
{{- if not .credentialsSecret }}
{{- if not .password }}
{{- fail (printf "%s[%d].password is required when the chart manages credentials. Set it, or set credentialsSecret to a pre-existing Secret holding DB2_USER and DB2_PASSWORD" $prefix $i) }}
{{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "splunk-otel-db2.credentialsSecretName" (dict "receiver" . "releaseName" $.Release.Name) }}
  labels:
    {{- include "splunk-otel-db2.labels" $ | nindent 4 }}
type: Opaque
stringData:
  DB2_USER: {{ .username | quote }}
  DB2_PASSWORD: {{ .password | quote }}
{{- end }}
{{- end }}
{{- end }}
