{{- range .Values.receivers }}
{{- if not .credentialsSecret }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "splunk-otel-db2-credentials-%s" .name }}
  labels:
    {{- include "splunk-otel-db2.labels" $ | nindent 4 }}
type: Opaque
stringData:
  DB2_USER: {{ .username | quote }}
  DB2_PASSWORD: {{ .password | quote }}
{{- end }}
{{- end }}
