apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "splunk-otel-db2.fullname" . }}
  labels:
    {{- include "splunk-otel-db2.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "splunk-otel-db2.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        # Force pod restart when config or credentials change
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "splunk-otel-db2.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "splunk-otel-db2.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ .Chart.Name }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          image: "{{ .Values.image.repository }}:{{ include "splunk-otel-db2.imageTag" . }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - /etc/splunk-otel-db2/config.yaml
          env:
            {{- range .Values.receivers }}
            - name: DB2_USER_{{ .name | upper | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "splunk-otel-db2.credentialsSecretName" (dict "receiver" . "releaseName" $.Release.Name) }}
                  key: DB2_USER
            - name: DB2_PASSWORD_{{ .name | upper | replace "-" "_" }}
              valueFrom:
                secretKeyRef:
                  name: {{ include "splunk-otel-db2.credentialsSecretName" (dict "receiver" . "releaseName" $.Release.Name) }}
                  key: DB2_PASSWORD
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/splunk-otel-db2
              readOnly: true
            - name: tmp
              mountPath: /tmp
            {{- range .Values.receivers }}
            {{- $tls := .tls | default dict }}
            {{- if dig "caSecret" "" $tls }}
            {{- /* One mount per receiver: different databases can be fronted by different
                   certificate authorities, so a single shared path would not do. See
                   caVolumeName for why it is keyed by receiver and not by Secret. */}}
            - name: {{ include "splunk-otel-db2.caVolumeName" . }}
              mountPath: /etc/splunk-otel-db2/ca/{{ include "splunk-otel-db2.caVolumeName" . }}
              readOnly: true
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: {{ include "splunk-otel-db2.fullname" . }}-config
        {{- range .Values.receivers }}
        {{- $tls := .tls | default dict }}
        {{- if dig "caSecret" "" $tls }}
        - name: {{ include "splunk-otel-db2.caVolumeName" . }}
          secret:
            secretName: {{ dig "caSecret" "" $tls | quote }}
            {{- /* Project just the one key, under a fixed name. Mounting the whole Secret
                   would expose every other key in it to the container, and would make the
                   file name depend on caSecretKey, which the config then has to agree
                   with. The key must exist: with optional unset, a typo leaves the pod
                   unschedulable with the reason on the Pod rather than silently starting
                   without a CA. */}}
            items:
              - key: {{ dig "caSecretKey" "ca.crt" $tls | quote }}
                path: ca.crt
            defaultMode: 0444
        {{- end }}
        {{- end }}
        - name: tmp
          emptyDir: {}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
