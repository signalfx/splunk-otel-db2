name: CI build

concurrency:
  # Pushes take a lock keyed on the ref alone and queue rather than cancel, so the
  # resolve -> publish image -> publish chart sequence runs as one transaction. Two merges
  # landing together would otherwise both read the same index, pick the same patch, and
  # race to overwrite each other's image tag and chart release.
  group: >-
    ${{ github.event_name == 'push'
        && format('release-{0}', github.ref)
        || format('ci-{0}-{1}', github.ref_name, github.event.pull_request.number || github.sha) }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - v[0-9]+.[0-9]+.x
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
      - v[0-9]+.[0-9]+.[0-9]+-*
  pull_request:

permissions:
  contents: read

env:
  # Must match the image used by the Db2Container instances in src/test/java.
  DB2_TEST_IMAGE: icr.io/db2_community/db2:11.5.9.0

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        if: hashFiles('gradlew') != ''
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        if: hashFiles('gradlew') != ''
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Build and test
        if: hashFiles('gradlew') != ''
        run: ./gradlew build

  docker-build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Build Docker image (validation only, no push)
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: false
          tags: ghcr.io/signalfx/splunk-otel-db2:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  helm-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Lint Helm chart
        run: helm lint packaging/helm

      - name: Check rendered output
        run: .github/scripts/helm-render-checks.sh

  integration-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Testcontainers applies its own deadline to image resolution, and the Db2 image is
      # several GB from icr.io. Pulling here means the test only starts an already-local
      # image, and a registry problem surfaces as an explicit pull failure rather than a
      # ContainerFetchException during test initialization.
      - name: Pre-pull DB2 image
        run: .github/scripts/pull-db2-image.sh "$DB2_TEST_IMAGE"

      - name: Run integration tests (live DB2 via Testcontainers)
        run: ./gradlew integrationTest

      - name: Upload integration test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-report
          path: build/reports/tests/integrationTest/

  integration-test-snapshot:
    needs: integration-test
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      # Separate runner from integration-test, so this job pulls the image again from cold.
      - name: Pre-pull DB2 image
        run: .github/scripts/pull-db2-image.sh "$DB2_TEST_IMAGE"

      - name: Run snapshot monitor integration tests (live DB2 via Testcontainers)
        run: ./gradlew integrationTestSnapshot

      - name: Upload snapshot integration test report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-test-snapshot-report
          path: build/reports/tests/integrationTestSnapshot/

  version:
    # Resolve the single version used by both the image tags and the chart, so an
    # appVersion can never point at an image tag that was never pushed.
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/v') ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Resolve version
        id: resolve
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            # An explicit tag is a deliberate override; honour it verbatim rather than
            # deriving, so re-tagging a commit publishes the version that was asked for.
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            .github/scripts/next-version.sh
          fi

  publish-image:
    # Publish to ghcr.io on merges to main/version branches and semver tags only
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/heads/v') ||
       startsWith(github.ref, 'refs/tags/v'))
    needs: [version, build, docker-build, helm-lint, integration-test, integration-test-snapshot]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Stamp jar version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The jar version is baked into the image at build time, so it has to be stamped
          # before the build rather than committed back to the branch.
          sed -i "s/^version = '.*'$/version = '${VERSION}'/" build.gradle
          grep -q "^version = '${VERSION}'$" build.gradle

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@902fa8ec7d6ecbf8d84d538b9b233a880e428804 # v5.7.0
        with:
          images: ghcr.io/signalfx/splunk-otel-db2
          tags: |
            # Only refs that can advance the chart index may claim a semantic tag. A v*.x
            # branch derives from an index it never updates, so it would re-emit the same
            # tag on every push and collide with the next release from main.
            type=raw,value=${{ needs.version.outputs.version }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: packaging/docker/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  publish-chart:
    # Only main publishes charts. Version branches and tags still publish images, but a
    # chart released off a side branch would land a version in the index that main would
    # then try to reuse.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [version, publish-image]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # chart-releaser needs the full history to tell which tags already exist.
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Require the gh-pages branch
        run: |
          # cr index --push runs `git worktree add --detach <dir> origin/gh-pages` and does
          # not create the branch; a missing ref fails with "invalid reference". Checking
          # first keeps that failure out of the middle of the transaction, where cr upload
          # would already have created a GitHub release with no matching index entry.
          if ! git show-ref --verify --quiet refs/remotes/origin/gh-pages; then
            echo "::error::The gh-pages branch does not exist, so the chart index cannot be" \
                 "published. Create it once with:" \
                 "git switch --orphan gh-pages && git commit --allow-empty -m 'Initialize gh-pages'" \
                 "&& git push -u origin gh-pages — then enable GitHub Pages on that branch."
            exit 1
          fi
          echo "origin/gh-pages present at $(git rev-parse --short origin/gh-pages)"

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0

      - name: Stamp chart version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd packaging/helm
          VERSION="$VERSION" yq e -i '.version = strenv(VERSION)' Chart.yaml
          VERSION="$VERSION" yq e -i '.appVersion = strenv(VERSION)' Chart.yaml
          yq e '{"version": .version, "appVersion": .appVersion}' Chart.yaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify the chart's appVersion image exists
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # publish-image ran first, so this is a guard against the two drifting apart
          # rather than a race. A chart whose appVersion has no image fails at install.
          docker manifest inspect "ghcr.io/signalfx/splunk-otel-db2:${VERSION}" >/dev/null

      - name: Install chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          install_only: true

      - name: Release chart to gh-pages
        env:
          VERSION: ${{ needs.version.outputs.version }}
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # cr is driven directly rather than through the action's default path. That path
          # discovers charts with `git diff --name-only <latest_tag> -- <charts_dir>`, so it
          # only releases when tracked files under charts_dir changed, and it silently
          # reports "Nothing to do" otherwise. Calling cr explicitly makes the release
          # unconditional and keeps the chart at packaging/helm, which is not the
          # <charts_dir>/<name>/Chart.yaml layout that discovery expects.
          mkdir -p .cr-release-packages .cr-index
          helm package packaging/helm \
            --version "$VERSION" --app-version "$VERSION" \
            --destination .cr-release-packages
          test -f ".cr-release-packages/splunk-otel-db2-${VERSION}.tgz"

          cr upload \
            --owner signalfx --git-repo splunk-otel-db2 \
            --token "$CR_TOKEN" \
            --package-path .cr-release-packages \
            --skip-existing

          # No --charts-repo: cr 1.7.0 does not accept it and points index entries at the
          # GitHub release assets cr upload just created, which is what we want.
          cr index \
            --owner signalfx --git-repo splunk-otel-db2 \
            --token "$CR_TOKEN" \
            --package-path .cr-release-packages \
            --index-path .cr-index/index.yaml \
            --push

      - name: Verify the version is now on the index
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Guards against a publish path that exits 0 without publishing. Pages needs a
          # moment to serve the new commit, so poll rather than check once.
          for attempt in $(seq 1 10); do
            if curl -sS --max-time 20 https://signalfx.github.io/splunk-otel-db2/index.yaml \
                 | yq e ".entries[\"splunk-otel-db2\"][].version" - 2>/dev/null \
                 | grep -qx "$VERSION"; then
              echo "index.yaml now lists $VERSION"
              exit 0
            fi
            echo "attempt $attempt: $VERSION not on the index yet; retrying in 15s"
            sleep 15
          done
          echo "::error::$VERSION was never published to the index"
          exit 1
