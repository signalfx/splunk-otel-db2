type: db2

status:
  class: receiver
  stability:
    development: [metrics, logs]

resource_attributes:
  db.namespace:
    description: The name of the database (maps to db.namespace in OTel semconv).
    type: string
    enabled: true
  db.system.name:
    description: The database management system. Always ibm.db2 for this receiver.
    type: string
    enabled: true
  server.address:
    description: The hostname of the DB2 server.
    type: string
    enabled: true
  server.port:
    description: The port of the DB2 server.
    type: int
    enabled: true
  service.name:
    description: Always splunk-otel-db2.
    type: string
    enabled: true
  service.instance.id:
    description: Unique instance identifier in the form host:port/database.
    type: string
    enabled: true

attributes:
  # --- shared metric attributes ---
  db.namespace:
    description: The name of the database.
    type: string
  db2.member:
    description: The DB2 member number in a pureScale or DPF environment.
    type: int

  # --- buffer pool metric attributes ---
  db2.bufferpool:
    description: Name of the buffer pool.
    type: string
  db2.read_type:
    description: Type of buffer pool read operation.
    type: string
    enum: [data, index, xda]

  # --- tablespace metric attributes ---
  db2.tablespace:
    description: Name of the tablespace.
    type: string
  db2.tablespace.state:
    description: State of the tablespace (e.g. NORMAL).
    type: string
  db2.tablespace.type:
    description: Type of the tablespace (DMS, SMS, etc.).
    type: string
  db2.tablespace.usage:
    description: Tablespace size breakdown dimension.
    type: string
    enum: [capacity, used, free]

  # --- top query event attributes ---
  db2.num_executions:
    description: Number of times the statement has been executed.
    type: int
  db2.total_elapsed_time:
    description: >
      Interval delta of statement execution elapsed time, in seconds.
      Computed as the difference in STMT_EXEC_TIME between two consecutive collections.
    type: double
  db2.avg_exec_time:
    description: Average execution elapsed time per execution this interval, in seconds.
    type: double
  db2.total_cpu_time:
    description: >
      Total CPU time consumed by the statement, in seconds
      (from TOTAL_CPU_TIME which is in microseconds).
    type: double
  db2.rows_read:
    description: Number of rows read by the statement.
    type: int
  db2.rows_returned:
    description: Number of rows returned to the client.
    type: int
  db2.rows_modified:
    description: Number of rows inserted, updated, or deleted.
    type: int
  db2.sorts:
    description: Number of sorts performed for the statement.
    type: int
  db2.sort_overflows:
    description: Number of sorts that ran out of sort heap and required disk space.
    type: int
  db2.stmt_type:
    description: >
      Statement type from the package cache. D = dynamic SQL, S = static (package) SQL.
      This is the raw package-cache code carried on top_query events; the metric-side
      classification is db2.statement_type.
    type: string

  # --- SQL and row activity metric attributes ---
  db2.statement_type:
    description: >
      How the SQL statement was prepared. DB2 also classifies the same statements by the
      operation they perform, which is db2.operation_type on db2.sql.operation.count; the
      two axes overlap, so they are separate metrics.
    type: string
    enum: [dynamic, static]
  db2.operation_type:
    description: The kind of operation the SQL statement performed.
    type: string
    enum: [select, uid, ddl]
  db2.transaction_type:
    description: Whether the transaction was committed or rolled back.
    type: string
    enum: [commit, rollback]
  db2.row_operation:
    description: >
      Which row modification was counted. Mutually exclusive, so summing across this
      attribute is meaningful. Rows read and rows returned are separate metrics rather
      than values here, because they are different measurements of the same rows.
    type: string
    enum: [inserted, updated, deleted]
  db2.internal:
    description: >
      True when the activity was initiated internally by the database manager rather
      than requested by an application.
    type: bool

  # --- direct I/O and transaction log metric attributes ---
  # Standard semantic-convention attribute, so it is deliberately not db2-prefixed.
  # Matches sqlserverreceiver and oracledbreceiver in opentelemetry-collector-contrib.
  disk.io.direction:
    description: The direction of the disk I/O operation.
    type: string
    enum: [read, write]

  # --- blocking session event attributes ---
  db2.blocking.blocker.session_id:
    description: Session identifier (application handle) of the session holding the lock (blocker).
    type: string
  db2.blocking.blocker.user:
    description: Authenticated user ID of the blocker.
    type: string
  db2.blocking.blocker.client_address:
    description: Client workstation name of the blocker.
    type: string
  db2.blocking.blocker.query_text:
    description: >
      Obfuscated SQL text of the blocker's active statement (from MON_CURRENT_SQL).
      For idle blockers, the last statement from MON_GET_PKG_CACHE_STMT is used.
      Omitted if unavailable or if obfuscation fails.
    type: string
  db2.blocking.blocker.is_idle:
    description: >
      True when the blocker has no active statement in MON_CURRENT_SQL —
      i.e. it is holding an open transaction but not currently executing.
    type: bool
  db2.blocking.lock.object_type:
    description: >
      DB2 lock object type (ROW, TABLE, PLAN, INTERNAL, TABLESPACE, etc.)
      from MON_LOCKWAITS.LOCK_OBJECT_TYPE.
    type: string
  db2.blocking.lock.mode:
    description: >
      Lock mode requested by the blocked session (S, X, IX, IS, SIX, Z, U, NS, NX, etc.)
      from MON_LOCKWAITS.LOCK_MODE_REQUESTED.
    type: string
  db2.blocking.lock.object_name:
    description: Name of the locked table or object from MON_LOCKWAITS.TABNAME.
    type: string
  db2.blocking.lock.schema:
    description: Schema of the locked object from MON_LOCKWAITS.TABSCHEMA.
    type: string
  db2.blocking.start_time:
    description: >
      Timestamp when the lock wait began. Approximated as now minus LOCK_WAIT_ELAPSED_TIME
      on the default MON_LOCKWAITS path; not available on the snapshot path (blocking
      detection is default-path only).
    type: string
  db2.blocking.wait_duration:
    description: >
      Elapsed time since the lock wait began, in seconds. Read directly from
      MON_LOCKWAITS.LOCK_WAIT_ELAPSED_TIME, which is an INTEGER SECONDS column on Db2 11.5.
    type: double

  # --- top query plan attributes (populated only when top_query_collection.max_explain_each_interval > 0) ---
  db2.query_plan:
    description: >
      JSON plan summary for the statement, produced by EXPLAIN_FROM_SECTION which reads
      the compiled section from the in-memory package cache (no query re-execution).
      Contains operator types and costs plus stream connectivity.
      Predicate text is pre-redacted before obfuscation: double-quoted content is replaced
      with "?" so that XQuery string literals are never emitted; as a side-effect, SQL
      delimited identifiers in predicate text are also replaced with "?".
      Stripped by the dbmon-processor after upload to object storage; consumers
      receive _dbmon.query_plan.object_key instead.
    type: string
  db2.query_plan.hash:
    description: >
      Db2 EXECUTABLE_ID hex string, uniquely identifying the compiled plan section in the
      package cache. Changes on recompile. On db.server.top_query: always emitted when
      max_explain_each_interval > 0. On db.server.query_sample: requires the Db2 10.5+
      default path (MON_GET_ACTIVITY.EXECUTABLE_ID) and plan collection actually being on,
      i.e. events.db.server.top_query.enabled plus max_explain_each_interval > 0 — without
      those nothing populates db2.query_plan, so a hash would reference a plan that can
      never be resolved. Not available on Db2 < 10.5 or on the snapshot monitor path.
    type: string

  # --- query sample event attributes ---
  db.query.text:
    description: Obfuscated SQL statement text. Literal values replaced with ?.
    type: string
  db2.session_id:
    description: Session identifier (application handle) of the active connection.
    type: string
  db2.activity_state:
    description: >
      Activity state concatenated with type, e.g. "EXECUTING SELECT", "LOCKWAIT DML".
      Values from MON_CURRENT_SQL.ACTIVITY_STATE + ACTIVITY_TYPE.
    type: string
  db2.session_status:
    description: "Coarse session lifecycle state derived from ACTIVITY_STATE: active, waiting, or idle."
    type: string
    enum: [active, waiting, idle]
  db2.query_start:
    description: Statement start timestamp (DB2 LOCAL_START_TIME format).
    type: string
  db2.session.duration:
    description: Wall-clock elapsed time since statement start, in seconds.
    type: double
  db2.cpu_time:
    description: >
      CPU time consumed by the connection in seconds (default path only,
      from MON_GET_CONNECTION.TOTAL_CPU_TIME which is in microseconds).
      Omitted on the snapshot monitor path.
    type: double
  db2.wait_time:
    description: >
      Cumulative lock wait time in seconds (Db2 10.5+ default path only,
      from MON_GET_ACTIVITY.LOCK_WAIT_TIME which is in milliseconds).
      Omitted on Db2 < 10.5 and on the snapshot monitor path.
    type: double
  user.name:
    description: Authenticated user ID (CLIENT_USERID from MON_GET_CONNECTION).
    type: string
  client.address:
    description: Client workstation name (CLIENT_WRKSTNNAME from MON_GET_CONNECTION).
    type: string

metrics:
  db2.buffer_pool.logical_reads:
    attributes: [db2.bufferpool, db2.member, db2.read_type]
    description: Number of logical read requests for pages in the buffer pool.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{read}"

  db2.buffer_pool.physical_reads:
    attributes: [db2.bufferpool, db2.member, db2.read_type]
    description: Number of physical read requests for pages from disk into the buffer pool.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{read}"

  db2.buffer_pool.read_time:
    attributes: [db2.bufferpool, db2.member]
    description: Total elapsed time spent reading from disk into the buffer pool.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.buffer_pool.write_time:
    attributes: [db2.bufferpool, db2.member]
    description: Total elapsed time spent writing from the buffer pool to disk.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.buffer_pool.writes:
    attributes: [db2.bufferpool, db2.member]
    description: Number of times buffer pool pages were written to disk (data + index + XDA).
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{write}"

  db2.connection.active:
    attributes: [db2.member]
    description: Number of connections currently executing in the database engine.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "{connection}"

  db2.connection.count:
    attributes: [db2.member]
    description: Number of current connections to the database.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "{connection}"

  db2.connection.max:
    attributes: [db2.member]
    description: Highest number of simultaneous connections since the database was activated.
    enabled: true
    stability: development
    gauge:
      value_type: int
    unit: "{connection}"

  db2.deadlock.count:
    attributes: [db2.member]
    description: Total number of deadlocks that have occurred.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{deadlock}"

  db2.lock.escalation.count:
    attributes: [db2.member]
    description: Number of times a lock was escalated from row to table level.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{escalation}"

  db2.lock.space_used:
    attributes: [db2.member]
    description: Total amount of lock list memory in use, in bytes.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "By"

  db2.lock.timeout.count:
    attributes: [db2.member]
    description: Number of times a request to lock an object timed out.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{timeout}"

  db2.lock.wait.count:
    attributes: [db2.member]
    description: Total number of times an application waited for a lock.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{wait}"

  db2.lock.wait_time:
    attributes: [db2.member]
    description: Total elapsed time spent waiting for locks.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.sort.count:
    attributes: [db2.member]
    description: Total number of sorts that have been executed.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{sort}"

  db2.sort.overflow.count:
    attributes: [db2.member]
    description: Total number of sorts that ran out of sort heap and required disk space.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{sort}"

  db2.tablespace.size:
    attributes: [db2.member, db2.tablespace, db2.tablespace.state, db2.tablespace.type, db2.tablespace.usage]
    description: Size of the tablespace in bytes, broken down by usage.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "By"

  # --- SQL and row activity (MON_GET_DATABASE) ---

  db2.sql.statement.count:
    attributes: [db2.member, db2.statement_type]
    description: Number of SQL statements attempted, by how the statement was prepared.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{statement}"

  db2.sql.operation.count:
    attributes: [db2.member, db2.operation_type]
    description: >
      Number of SQL statements executed, by the kind of operation performed. Separate from
      db2.sql.statement.count because the two classifications overlap: one statement is
      counted once in each.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{statement}"

  db2.sql.failed.count:
    attributes: [db2.member]
    description: Number of SQL statements that failed.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{statement}"

  db2.transaction.count:
    attributes: [db2.member, db2.transaction_type, db2.internal]
    description: Number of transactions committed or rolled back.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{transaction}"

  db2.row.count:
    attributes: [db2.member, db2.row_operation, db2.internal]
    description: >
      Number of rows inserted, updated or deleted. Holds only that mutually exclusive
      partition, so aggregating db2.row_operation gives a meaningful total.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{row}"

  db2.row.modified.count:
    attributes: [db2.member]
    description: >
      Number of rows changed. Counts rows changed by triggers and referential integrity
      enforcement as well, so it can exceed the total of db2.row.count.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{row}"

  db2.row.read.count:
    attributes: [db2.member]
    description: Number of rows read from tables.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{row}"

  db2.row.returned.count:
    attributes: [db2.member]
    description: Number of rows returned to clients.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{row}"

  db2.sql.compilation.count:
    attributes: [db2.member]
    description: Number of SQL statement compilations.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{compilation}"

  db2.sql.compilation.time:
    attributes: [db2.member]
    description: Total time spent compiling SQL statements.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.sql.bind.count:
    attributes: [db2.member]
    description: Number of binds and precompiles attempted.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{bind}"

  db2.sql.rebind.count:
    attributes: [db2.member]
    description: Number of times packages were implicitly rebound.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{rebind}"

  db2.deadlock.rollback.count:
    attributes: [db2.member]
    description: >
      Number of internal rollbacks caused by a deadlock. Only emitted when
      use_snapshot_monitor is enabled.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{rollback}"

  # --- Sort and direct I/O (MON_GET_DATABASE) ---

  db2.sort.heap.allocated:
    attributes: [db2.member]
    description: >
      Total sort heap space allocated. Db2 reports this element in pages without stating the
      size; 4KB is taken from its documented comparability with the sheapthres configuration
      parameter and from the sibling SORT_HEAP_TOP element, which is explicitly documented in
      4KB pages.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "By"

  db2.sort.shared.heap.allocated:
    attributes: [db2.member]
    description: Total amount of shared sort memory allocated.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "By"

  db2.sort.shared.heap.max:
    attributes: [db2.member]
    description: Shared sort memory high watermark.
    enabled: true
    stability: development
    gauge:
      value_type: int
    unit: "By"

  db2.sort.time:
    attributes: [db2.member]
    description: Total elapsed time spent performing section sorts.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.sort.active:
    attributes: [db2.member]
    description: Number of sorts currently active.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "{sort}"

  db2.hash_join.active:
    attributes: [db2.member]
    description: Number of hash joins currently active.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "{hash_join}"

  db2.olap_function.active:
    attributes: [db2.member]
    description: Number of OLAP functions currently active.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "{function}"

  db2.direct.io.count:
    attributes: [db2.member, disk.io.direction]
    description: Number of read or write operations that bypass the buffer pool.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{operation}"

  db2.direct.io.request.count:
    attributes: [db2.member, disk.io.direction]
    description: Number of requests to perform a direct read or write of one or more sectors of data.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{request}"

  db2.direct.io.time:
    attributes: [db2.member, disk.io.direction]
    description: Total elapsed time spent performing direct reads or writes.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  # --- Transaction log (MON_GET_TRANSACTION_LOG, plus log disk waits from MON_GET_DATABASE) ---

  db2.log.space.available:
    attributes: [db2.member]
    description: Amount of active log space not being used by uncommitted transactions.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "By"

  db2.log.space.used:
    attributes: [db2.member]
    description: Total amount of active log space currently used.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "By"

  db2.log.space.used.max:
    attributes: [db2.member]
    description: >
      Maximum amount of total log space used. Includes secondary log space, so
      db2.log.space.secondary.used.max is a subset of this rather than a disjoint pool —
      the two must not be added together.
    enabled: true
    stability: development
    gauge:
      value_type: int
    unit: "By"

  db2.log.space.secondary.used.max:
    attributes: [db2.member]
    description: >
      Maximum amount of secondary log space used. A subset of db2.log.space.used.max,
      not a disjoint pool.
    enabled: true
    stability: development
    gauge:
      value_type: int
    unit: "By"

  db2.log.secondary_files.allocated:
    attributes: [db2.member]
    description: Total number of secondary log files currently in use.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "{file}"

  db2.log.io.pages:
    attributes: [db2.member, disk.io.direction]
    description: Number of log pages read from or written to disk by the logger.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{page}"

  db2.log.io.time:
    attributes: [db2.member, disk.io.direction]
    description: Total elapsed time spent by the logger reading from or writing to disk.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.log.io.count:
    attributes: [db2.member, disk.io.direction]
    description: Number of I/O requests issued by the logger to read or write log data.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{operation}"

  db2.log.partial_page_io.count:
    attributes: [db2.member]
    description: Number of I/O requests issued by the logger for writing partial log data.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{operation}"

  db2.log.buffer_full.count:
    attributes: [db2.member]
    description: >
      Number of times agents had to wait because the log buffer was full while copying log
      records into it. A log-buffer-sizing signal; contrast db2.log.disk_wait.count, which
      counts all agent waits on log writes.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{wait}"

  db2.log.buffer_hit.count:
    attributes: [db2.member]
    description: Number of times an agent read log data from the log buffer.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{read}"

  db2.log.recovery.redo:
    attributes: [db2.member]
    description: Amount of log that would have to be redone for crash recovery.
    enabled: true
    stability: development
    sum:
