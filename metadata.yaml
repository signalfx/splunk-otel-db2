    unit: "{wait}"

events:
  db.server.query_sample:
    enabled: false
    description: >
      An active SQL statement sampled from MON_CURRENT_SQL (default path, Db2 9.7+)
      or SNAP_GET_STMT (snapshot monitor path). SQL text is obfuscated before emission —
      literal values are replaced with ?. Emitted at query_sample_interval as OTel log
      records with severity INFO.

      When the sampled session is waiting for a lock (LOCKWAIT), the record is enriched
      with blocking attributes and emitted at severity WARN — same convention as the
      SQL Server, Oracle, and PostgreSQL OTel receivers. Blocking detection is available
      on the default path only (use_snapshot_monitor: false); the snapshot path emits
      INFO records without blocking attributes.

      Idle blockers (holding an open transaction but not currently executing) have their
      last SQL looked up from MON_GET_PKG_CACHE_STMT and included as
      db2.blocking.blocker.query_text on the blocked session's record.
    attributes:
      - db.system.name
      - db.namespace
      - db.query.text
      - db2.session_id
      - db2.activity_state
      - db2.session_status
      - db2.query_plan.hash                    # Db2 10.5+ default path AND plan collection enabled (top_query + max_explain_each_interval > 0)
      - db2.query_start
      - db2.session.duration
      - db2.member
      - db2.cpu_time                           # default path only; omitted on snapshot path
      - db2.wait_time                          # Db2 10.5+ default path only; omitted otherwise
      - user.name
      - client.address
      # Blocking attributes — populated only when this session is in LOCKWAIT (default path)
      - db2.blocking.blocker.session_id        # omitted when not blocked
      - db2.blocking.blocker.user              # omitted when not blocked
      - db2.blocking.blocker.client_address    # omitted when not blocked
      - db2.blocking.blocker.query_text        # omitted when unavailable or obfuscation fails
      - db2.blocking.blocker.is_idle           # omitted on snapshot path
      - db2.blocking.lock.object_type          # omitted when not blocked
      - db2.blocking.lock.mode                 # omitted when not blocked
      - db2.blocking.lock.object_name          # omitted when not blocked
      - db2.blocking.lock.schema               # omitted when not blocked
      - db2.blocking.start_time                # omitted when not blocked
      - db2.blocking.wait_duration             # omitted when not blocked

  db.server.top_query:
    enabled: false
    description: >
      A top SQL statement from the Db2 plan cache, approximately ranked by execution
      elapsed time added during the current collection interval (per-interval delta of
      STMT_EXEC_TIME). The SQL first selects at most max_query_sample_count candidates
      by cumulative lifetime elapsed time; interval deltas are then ranked over that set.
      A newly-hot statement outside the cumulative top-N can be missed in one interval.
      SQL text is obfuscated before emission — literal values are replaced with ?.
      Emitted at top_query_interval as OTel log records with severity INFO.
      The first collection after startup seeds the delta baseline and emits nothing.

      When top_query_collection.max_explain_each_interval is greater than zero, each
      record is optionally enriched with db2.query_plan (JSON plan summary from
      EXPLAIN_FROM_SECTION) and db2.query_plan.hash (EXECUTABLE_ID hex string, changes
      on recompile). No query re-execution occurs — EXPLAIN_FROM_SECTION reads the
      compiled section from the in-memory package cache (SECTION_SOURCE_TYPE='M'). At
      most top_query_collection.max_explain_each_interval explain calls are issued per
      interval as a budget cap. Plans are cached client-side (up to
      top_query_collection.query_plan_cache_size entries, TTL controlled by
      top_query_collection.query_plan_cache_ttl) to avoid re-explaining the same
      unchanged section on every scrape. Requires explain tables to be pre-created
      once per schema: CALL SYSPROC.SYSINSTALLOBJECTS('EXPLAIN','C',NULL,CURRENT SCHEMA).
    attributes:
      - db.system.name
      - db.namespace
      - db.query.text
      - db2.member
      - db2.num_executions
      - db2.total_elapsed_time
      - db2.avg_exec_time
      - db2.total_cpu_time
      - db2.rows_read
      - db2.rows_returned
      - db2.rows_modified
      - db2.sorts
      - db2.sort_overflows
      - db2.stmt_type
      - db2.query_plan                              # populated only when max_explain_each_interval > 0
      - db2.query_plan.hash                         # populated only when max_explain_each_interval > 0
