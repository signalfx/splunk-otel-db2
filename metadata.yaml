type: db2
display_name: IBM DB2 Receiver
description: |
  Collects metrics from IBM DB2 via JDBC using MON_GET_* table functions.
  Supports DB2 11.5+ on Linux/UNIX/Windows single-member and pureScale topologies.

status:
  class: receiver
  stability:
    alpha: [metrics, logs]
  distributions: [splunk]
  codeowners:
    active: [ssirothi]

resource_attributes:
  server.address:
    description: Hostname or IP address of the DB2 server.
    enabled: true
    type: string
  server.port:
    description: TCP port of the DB2 server.
    enabled: true
    type: int
  db.system.name:
    description: Database system identifier. Always "db2".
    enabled: true
    type: string
  db.namespace:
    description: Name of the database.
    enabled: true
    type: string
  service.instance.id:
    description: Unique identifier of the DB2 instance (host:port/database).
    enabled: true
    type: string

attributes:
  db.system.name:
    description: Database system identifier.
    type: string
    requirement_level: recommended
  db.namespace:
    description: Name of the database.
    type: string
    requirement_level: recommended
  db2.buffer_pool:
    description: Buffer pool name.
    type: string
    requirement_level: recommended
  db2.read_type:
    description: Read type — logical reads from buffer pool or physical reads from disk.
    type: string
    requirement_level: recommended
    enum: [data, index]
  db2.member:
    description: DB2 member number in a multi-member or pureScale topology.
    type: string
    requirement_level: opt_in
  db2.tablespace:
    description: Tablespace name.
    type: string
    requirement_level: recommended
  db2.tablespace.state:
    description: Tablespace size category.
    type: string
    requirement_level: recommended
    enum: [used, free, capacity]

metrics:
  db2.user.connection.count:
    enabled: true
    description: Number of currently active connections to the database.
    unit: "{connections}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [db.system.name, db.namespace]

  db2.deadlocks:
    enabled: true
    description: Total deadlocks detected since DB2 startup.
    unit: "{deadlocks}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db.system.name, db.namespace]

  db2.lock.waits:
    enabled: true
    description: Total lock waits since DB2 startup.
    unit: "{waits}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db.system.name, db.namespace]

  db2.lock.wait.time:
    enabled: true
    description: Total time spent waiting for locks since DB2 startup.
    unit: s
    sum:
      value_type: double
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db.system.name, db.namespace]

  db2.lock.timeouts:
    enabled: true
    description: Total lock timeouts since DB2 startup.
    unit: "{timeouts}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db.system.name, db.namespace]

  db2.buffer_pool.hit_ratio:
    enabled: true
    description: Buffer pool hit ratio percentage.
    unit: "%"
    gauge:
      value_type: double
    attributes: [db.system.name, db.namespace, db2.buffer_pool, db2.member]

  db2.buffer_pool.reads:
    enabled: true
    description: Buffer pool logical reads since DB2 startup.
    unit: "{reads}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db.system.name, db.namespace, db2.buffer_pool, db2.member, db2.read_type]

  db2.buffer_pool.physical_reads:
    enabled: true
    description: Buffer pool physical disk reads since DB2 startup.
    unit: "{reads}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db.system.name, db.namespace, db2.buffer_pool, db2.member, db2.read_type]

  db2.tablespace.size:
    enabled: true
    description: Tablespace size in bytes.
    unit: By
    gauge:
      value_type: int
    attributes: [db.system.name, db.namespace, db2.tablespace, db2.member, db2.tablespace.state]
