type: db2

status:
  class: receiver
  stability:
    development: [metrics]

resource_attributes:
  db.name:
    description: The name of the database.
    type: string
    enabled: true
  db2.member:
    description: The DB2 member number in a pureScale or DPF environment.
    type: int
    enabled: true

attributes:
  db2.read_type:
    description: Type of buffer pool read operation.
    type: string
    enum: [data, index, xda]
  db2.bufferpool:
    description: Name of the buffer pool.
    type: string
  db2.tablespace:
    description: Name of the tablespace.
    type: string
  db2.tablespace.type:
    description: Type of the tablespace (DMS, SMS, etc.).
    type: string
  db2.tablespace.state:
    description: State of the tablespace (e.g. NORMAL).
    type: string
  db2.tablespace.usage:
    description: Tablespace size breakdown dimension.
    type: string
    enum: [capacity, used, free]

metrics:
  # ── Database-level (MON_GET_DATABASE) ─────────────────────────────────────

  db2.connection.count:
    enabled: true
    description: Number of current connections to the database.
    unit: "{connection}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: []

  db2.connection.active:
    enabled: true
    description: Number of connections currently executing in the database engine.
    unit: "{connection}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: []

  db2.connection.max:
    enabled: true
    description: Highest number of simultaneous connections since the database was activated.
    unit: "{connection}"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: []

  db2.lock.wait.count:
    enabled: true
    description: Total number of times an application waited for a lock.
    unit: "{wait}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []

  db2.lock.wait_time:
    enabled: true
    description: Total elapsed time in milliseconds spent waiting for locks.
    unit: "ms"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []

  db2.lock.timeout.count:
    enabled: true
    description: Number of times a request to lock an object timed out.
    unit: "{timeout}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []

  db2.lock.escalation.count:
    enabled: true
    description: Number of times a lock was escalated from row to table level.
    unit: "{escalation}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []

  db2.lock.space_used:
    enabled: true
    description: Total amount of lock list memory in use, in bytes.
    unit: "By"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: []

  db2.deadlock.count:
    enabled: true
    description: Total number of deadlocks that have occurred.
    unit: "{deadlock}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []

  db2.sort.count:
    enabled: true
    description: Total number of sorts that have been executed.
    unit: "{sort}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []

  db2.sort.overflow.count:
    enabled: true
    description: Total number of sorts that ran out of sort heap and required disk space.
    unit: "{sort}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: []

  # ── Buffer pool (MON_GET_BUFFERPOOL) ──────────────────────────────────────

  db2.buffer_pool.logical_reads:
    enabled: true
    description: Number of logical read requests for pages in the buffer pool.
    unit: "{read}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db2.bufferpool, db2.read_type]

  db2.buffer_pool.physical_reads:
    enabled: true
    description: Number of physical read requests for pages from disk into the buffer pool.
    unit: "{read}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db2.bufferpool, db2.read_type]

  db2.buffer_pool.writes:
    enabled: true
    description: Number of times buffer pool pages were written to disk.
    unit: "{write}"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db2.bufferpool]

  db2.buffer_pool.read_time:
    enabled: true
    description: Total elapsed time in milliseconds spent reading from disk into the buffer pool.
    unit: "ms"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db2.bufferpool]

  db2.buffer_pool.write_time:
    enabled: true
    description: Total elapsed time in milliseconds spent writing from the buffer pool to disk.
    unit: "ms"
    sum:
      value_type: int
      monotonic: true
      aggregation_temporality: cumulative
    attributes: [db2.bufferpool]

  # ── Tablespace (MON_GET_TABLESPACE) ───────────────────────────────────────

  db2.tablespace.size:
    enabled: true
    description: Size of the tablespace in bytes, broken down by usage.
    unit: "By"
    sum:
      value_type: int
      monotonic: false
      aggregation_temporality: cumulative
    attributes: [db2.tablespace, db2.tablespace.type, db2.tablespace.state, db2.tablespace.usage]
