type: db2

status:
  class: receiver
  stability:
    development: [metrics, logs]

resource_attributes:
  db.namespace:
    description: The name of the database (maps to db.namespace in OTel semconv).
    type: string
    enabled: true
  db.system.name:
    description: The database management system. Always ibm.db2 for this receiver.
    type: string
    enabled: true
  server.address:
    description: The hostname of the DB2 server.
    type: string
    enabled: true
  server.port:
    description: The port of the DB2 server.
    type: int
    enabled: true
  service.name:
    description: Always splunk-otel-db2.
    type: string
    enabled: true
  service.instance.id:
    description: Unique instance identifier in the form host:port/database.
    type: string
    enabled: true

attributes:
  # --- shared metric attributes ---
  db.namespace:
    description: The name of the database.
    type: string
  db2.member:
    description: The DB2 member number in a pureScale or DPF environment.
    type: int

  # --- buffer pool metric attributes ---
  db2.bufferpool:
    description: Name of the buffer pool.
    type: string
  db2.read_type:
    description: Type of buffer pool read operation.
    type: string
    enum: [data, index, xda]

  # --- tablespace metric attributes ---
  db2.tablespace:
    description: Name of the tablespace.
    type: string
  db2.tablespace.state:
    description: State of the tablespace (e.g. NORMAL).
    type: string
  db2.tablespace.type:
    description: Type of the tablespace (DMS, SMS, etc.).
    type: string
  db2.tablespace.usage:
    description: Tablespace size breakdown dimension.
    type: string
    enum: [capacity, used, free]

  # --- query sample event attributes ---
  db.query.text:
    description: Obfuscated SQL statement text. Literal values replaced with ?.
    type: string
  db2.application_handle:
    description: Application handle / agent ID.
    type: string
  db2.activity_state:
    description: >
      Activity state concatenated with type, e.g. "EXECUTING SELECT", "LOCKWAIT DML".
      Values from MON_CURRENT_SQL.ACTIVITY_STATE + ACTIVITY_TYPE.
    type: string
  db2.query_start:
    description: Statement start timestamp (DB2 LOCAL_START_TIME format).
    type: string
  db2.session.duration:
    description: Wall-clock elapsed time since statement start, in seconds.
    type: double
  db2.cpu_time:
    description: >
      CPU time consumed by the connection in seconds (default path only,
      from MON_GET_CONNECTION.TOTAL_CPU_TIME which is in microseconds).
      Omitted on the snapshot monitor path.
    type: double
  db2.wait_time:
    description: >
      Cumulative lock wait time in seconds (Db2 10.5+ default path only,
      from MON_GET_ACTIVITY.LOCK_WAIT_TIME which is in milliseconds).
      Omitted on Db2 < 10.5 and on the snapshot monitor path.
    type: double
  user.name:
    description: Authenticated user ID (CLIENT_USERID from MON_GET_CONNECTION).
    type: string
  client.address:
    description: Client workstation name (CLIENT_WRKSTNNAME from MON_GET_CONNECTION).
    type: string

metrics:
  db2.buffer_pool.logical_reads:
    attributes: [db2.bufferpool, db2.member, db2.read_type]
    description: Number of logical read requests for pages in the buffer pool.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{read}"

  db2.buffer_pool.physical_reads:
    attributes: [db2.bufferpool, db2.member, db2.read_type]
    description: Number of physical read requests for pages from disk into the buffer pool.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{read}"

  db2.buffer_pool.read_time:
    attributes: [db2.bufferpool, db2.member]
    description: Total elapsed time spent reading from disk into the buffer pool.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.buffer_pool.write_time:
    attributes: [db2.bufferpool, db2.member]
    description: Total elapsed time spent writing from the buffer pool to disk.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.buffer_pool.writes:
    attributes: [db2.bufferpool, db2.member]
    description: Number of times buffer pool pages were written to disk (data + index + XDA).
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{write}"

  db2.connection.active:
    attributes: [db2.member]
    description: Number of connections currently executing in the database engine.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "{connection}"

  db2.connection.count:
    attributes: [db2.member]
    description: Number of current connections to the database.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "{connection}"

  db2.connection.max:
    attributes: [db2.member]
    description: Highest number of simultaneous connections since the database was activated.
    enabled: true
    stability: development
    gauge:
      value_type: int
    unit: "{connection}"

  db2.deadlock.count:
    attributes: [db2.member]
    description: Total number of deadlocks that have occurred.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{deadlock}"

  db2.lock.escalation.count:
    attributes: [db2.member]
    description: Number of times a lock was escalated from row to table level.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{escalation}"

  db2.lock.space_used:
    attributes: [db2.member]
    description: Total amount of lock list memory in use, in bytes.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "By"

  db2.lock.timeout.count:
    attributes: [db2.member]
    description: Number of times a request to lock an object timed out.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{timeout}"

  db2.lock.wait.count:
    attributes: [db2.member]
    description: Total number of times an application waited for a lock.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{wait}"

  db2.lock.wait_time:
    attributes: [db2.member]
    description: Total elapsed time spent waiting for locks.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: double
    unit: "s"

  db2.sort.count:
    attributes: [db2.member]
    description: Total number of sorts that have been executed.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{sort}"

  db2.sort.overflow.count:
    attributes: [db2.member]
    description: Total number of sorts that ran out of sort heap and required disk space.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: true
      value_type: int
    unit: "{sort}"

  db2.tablespace.size:
    attributes: [db2.member, db2.tablespace, db2.tablespace.state, db2.tablespace.type, db2.tablespace.usage]
    description: Size of the tablespace in bytes, broken down by usage.
    enabled: true
    stability: development
    sum:
      aggregation_temporality: cumulative
      monotonic: false
      value_type: int
    unit: "By"

events:
  db.server.query_sample:
    enabled: false
    description: >
      An active SQL statement sampled from MON_CURRENT_SQL (default path, Db2 9.7+)
      or SNAP_GET_STMT (snapshot monitor path). SQL text is obfuscated before emission —
      literal values are replaced with ?. Emitted at query_sample_interval as OTel log
      records with severity INFO.
    attributes:
      - db.system.name
      - db.namespace
      - db.query.text
      - db2.application_handle
      - db2.activity_state
      - db2.query_start
      - db2.session.duration
      - db2.member
      - db2.cpu_time       # default path only; omitted on snapshot path
      - db2.wait_time      # Db2 10.5+ default path only; omitted otherwise
      - user.name
      - client.address
