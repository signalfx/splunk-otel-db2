# Single-database form (receivers.db2 as a map):
receivers:
  db2:
    hostname: "localhost"
    hostport: 50000
    username: "${env:DB2_USER}"
    password: "${env:DB2_PASSWORD}"
    database: "SAMPLE"
    collection_interval: "30s"
    connect_timeout_seconds: 10      # JDBC login + socket timeout (default: 10)
    top_query_count: 250
    query_sample_enabled: false      # set true to enable query sampling (opt-in)
    max_query_sample_count: 1000
    query_sample_interval: "10s"
    top_query_interval: "60s"
    use_snapshot_monitor: false
    tls:
      insecure: false  # set to true if your DB2 instance does not have TLS configured

exporters:
  otlp:
    endpoint: "http://localhost:4317"

# Note: pipeline wiring (metrics + logs → otlp) is handled by Db2Pipeline directly.
# There is no OTel Collector service block — this receiver runs as a standalone process.

