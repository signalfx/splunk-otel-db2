# Single-database form:
receivers:
  db2:
    hostname: "localhost"
    # Db2 requires ssl_svcename to listen on a different port from svcename, so with TLS on
    # (the default below) this must be the TLS port, not the cleartext 50000.
    hostport: 50001
    username: "${env:DB2_USER}"
    password: "${env:DB2_PASSWORD}"
    database: "SAMPLE"
    collection_interval: "30s"
    connect_timeout_seconds: 10
    use_snapshot_monitor: false
    # Top queries and query samples are opt-in, and each is enabled here rather than by a
    # flag beside its tuning: the receiver reads `events` for the switch and the
    # *_collection blocks for the settings.
    events:
      db.server.top_query:
        enabled: false
      db.server.query_sample:
        enabled: true
    top_query_collection:
      collection_interval: "60s"
      top_query_count: 250
      max_query_sample_count: 1000
    query_sample_collection:
      collection_interval: "10s"
      max_rows_per_query: 100
    tls:
      insecure: false

exporters:
  otlp:
    endpoint: "http://localhost:4317"

